<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a3d" />
      <stop offset="100%" stop-color="#eb3d26" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#eb3d26" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS Squircle / Luxury Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8" />

  <!-- Inner Ambient Depth Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="3" />

  <!-- Monogram Glyph "A" with Didone High-Contrast Geometry -->
  <g id="brand-glyph">
    <!-- Left Stem (Thinner graceful serif angle) -->
    <polygon points="256,110 236,110 132,374 168,374 196,298 256,298" fill="url(#chromeGrad)" opacity="0.9" />

    <!-- Right Stem (Bold High-Contrast Column) -->
    <polygon points="256,110 276,110 380,374 340,374 312,298 256,298" fill="url(#chromeGrad)" />

    <!-- Sharp Top Serif Accent -->
    <rect x="230" y="104" width="52" height="10" rx="3" fill="#ffffff" />

    <!-- Base Left Foot Serif -->
    <rect x="122" y="370" width="54" height="10" rx="3" fill="#cbd5e1" />

    <!-- Base Right Foot Serif -->
    <rect x="332" y="370" width="54" height="10" rx="3" fill="#cbd5e1" />

    <!-- Crossbar Inner Cutout -->
    <polygon points="256,170 216,274 296,274" fill="url(#bgGrad)" />

    <!-- High-Impact Signature Accent Dot (Brand Pulse) -->
    <circle cx="396" cy="140" r="26" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>
</svg>
